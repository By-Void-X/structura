name: build-structura

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project (structura-src.zip)
        run: unzip -q structura-src.zip

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake python3 python3-pil curl zlib1g-dev unzip

      - name: Download Android NDK r28c (official, to the path scripts/build.sh expects)
        run: |
          mkdir -p "$HOME/.cache/ndk"
          curl -fL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
          unzip -q /tmp/ndk.zip -d "$HOME/.cache/ndk"
          test -x "$HOME/.cache/ndk/android-ndk-r28c/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"

      - name: Fetch preloader-android SDK (CMake expects ../vendor/preloader-android)
        run: |
          mkdir -p vendor
          git clone --depth 1 https://github.com/LiteLDev/preloader-android vendor/preloader-android

      - name: Build Structura.levipack
        working-directory: structura
        shell: bash
        run: |
          set -o pipefail
          bash scripts/build.sh 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Show error on Summary page (only when the build failed)
        if: failure()
        shell: bash
        run: |
          {
            echo "## Build gagal, 120 baris log terakhir"
            echo '```'
            tail -n 120 "$GITHUB_WORKSPACE/build.log" 2>/dev/null || echo "build.log tidak ada: error terjadi sebelum build dimulai"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Structura
          path: structura/release/Structura.levipack
